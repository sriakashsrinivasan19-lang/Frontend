<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
</head>
<body>
    <header>
        <h2>Audio Player</h2>
    </header>
    <section>
        <div>
            <audio controls loop>
                <source src="assets/music/1.mp3" type="audio/mp3">
            </audio><br/>
            <audio controls muted>
                <source src="assets/music/2.mp3" type="audio/mp3">
            </audio>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
</head>
<body>
     <header>
        <center>
            <div>
                <h1>Contact Form</h1>
            </div>
        </center>
    </header>
    <main>
        <div>
            <form>
                <center>
                    <form action="#" method="post"></form>
                    <label for="name">username</label>
                        <input type="text" name="Username" id="name"  placeholder="enter your name" required><br />
                    <label for="number">mobile no.</label>
                        <input type="number" name="mobile number" id="number" placeholder="enter your number"  required><br />
                    <label for="email ">email</label>
                        <input type="email" name="email" id="email" placeholder="enter your email" required><br />           
                    <label for="message">message</label>
                    <textarea name="message" id="message" rows="5" cols="40" placeholder="type your text here..." required></textarea><br />
                        <input type="submit" value="Send">
                        <input type="reset" value="Clear">
   </body>
</html>

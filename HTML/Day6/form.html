<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sla form</title>
</head>
<body>
    <header>
        <center>
            <div>
                <h1>SLA INSTITUTE</h1>
            </div>
        </center>
    </header>
    <main>
        <div>
            <form>
                <center>
                    <form action="#" method="post"></form>
                    <label for="name">username</label>
                        <input type="text" name="Username" id="name"  placeholder="enter your name" required><br />
                    <label for="password">password</label>
                        <input type="password" name="password" id="password" placeholder="ente your password"  minlength="6" maxlength="6" required><br />
                    <label for="email ">email</label>
                        <input type="email" name="Email" id="email" placeholder="enter your email" required><br />
                    <label for="age">age</label>
                        <input type="number" name="age" id="age" placeholder="Enter your Age" required><br />
                    <label for="Gender">Gender</label>
                        <input type="radio" name="Gender" id="Gender" required>male
                        <input type="radio" name="Gender" id="Gender" required>female <br />
                    <label for="enter the dob">Date of Birth</label>
                        <input type="date" id="enter the dob"><br />
                    <label for="enter the course">course</label>
                        <select>
                            <option value="">SELECT ONE</option>
                            <option value="">FULLSTACK DEVELOPER</option>
                            <option value="">FRONTEND</option>
                            <option value="">BACKEND</option>
                        </select><br />

                    <label>Skills:</label>
                    <label for="html">HTML</label>
                        <input type="checkbox" id="html" name="skills" value="HTML">
                    <label for="css">CSS</label>
                        <input type="checkbox" id="css" name="skills" value="CSS">
                    <label for="javascript">JavaScript</label>    
                        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
                    <label for="Sql">Sql</label>  
                        <input type="checkbox" id="Sql" name="skills" value="Sql"><br />  
                        <input type="submit" value="submit">
                        <input type="submit" value="clear">
                </center>
            </form>
        </div>
    </main>
</body>
</html>

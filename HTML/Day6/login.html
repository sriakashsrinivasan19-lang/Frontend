<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form</title>
</head>
<body>
    <center>
   <header>
    <div>
        <h1>LOGIN</h1>
    </div>
   </header>
   <main>
    <div>
        <form action="#" method="post">
        <label for="name">username</label>
            <input type="text" name="username" id="name" placeholder="enter your name" required><br />
        <label for="password">password</label>
            <input type="password" name="password" id="password" placeholder="enter your password" minlength="6" maxlength="6" required><br />
        <label for="check">show password</label>
            <input type="checkbox" name="show password" id="check" required><br />
            <input type="submit" value="login">
            <input type="submit" value="clear">
        </form>
    </div>
   </main>
    </center>
</body>
</html>

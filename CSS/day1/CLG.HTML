<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Departments</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1 {
            color: navy;
        }

        .department {
            width: 300px;
            height: 60px;
            text-align: center;
            color: white;
            line-height: 60px;
            font-size: 20px;
            font-weight: bold;
            margin: 15px auto;
            border-radius: 8px;
        }

        .cse {
            background-color: #007BFF;
        }

        .it {
            background-color: #28A745;
        }

        .ece {
            background-color: #FFC107;
            color: black;
        }

        .eee {
            background-color: #DC3545;
        }

        .mechanical {
            background-color: #6F42C1;
        }
    </style>
</head>
<body>

    <h1>Engineering Departments</h1>

    <div class="department cse">CSE</div>

    <div class="department it">IT</div>

    <div class="department ece">ECE</div>

    <div class="department eee">EEE</div>

    <div class="department mechanical">Mechanical</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>none behaviour</title>
</head>
<body>
<div class="container">

    <div class="demo">
        <h3>display: none</h3>
    </div>
    <div class="box red">1</div>
    <div class="box green-display">2</div>
    <div class="box blue">3</div>
    <div class="demo">
    <h3>visibility: hidden</h3>
    </div>

    <div class="box red">1</div>
    <div class="box green-visibility">2</div>
    <div class="box blue">3</div>

   
</div>
</body>
</html>

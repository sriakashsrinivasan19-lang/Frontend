<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Catalog — AI Learn Enterprise</title>
    <meta name="description" content="Explore complete enterprise Artificial Intelligence, Machine Learning, Deep Learning, and LLM courses.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Enterprise Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>

<body data-page="courses" class="bg-[#060813] text-slate-200 font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-300 overflow-x-hidden min-h-screen relative">

    <canvas id="neuralCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-35"></canvas>

    <div class="glow-sphere w-96 h-96 bg-cyan-500/10 top-0 left-1/3"></div>
    <div class="glow-sphere w-96 h-96 bg-purple-600/10 top-1/2 right-10"></div>

    <!-- GLOBAL NAVBAR -->
    <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 glass-nav" id="globalNavbar"></header>

    <main class="relative z-10 pt-28 pb-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Page Header -->
            <div class="text-center max-w-3xl mx-auto mb-12 space-y-4">
                <span class="text-xs font-mono font-semibold uppercase tracking-widest text-cyan-400 bg-cyan-400/10 px-3 py-1 rounded-full border border-cyan-400/20">
                    Enterprise Curriculum
                </span>
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-display font-extrabold text-white tracking-tight">
                    Technical <span class="text-gradient">Course Catalog</span>
                </h1>
                <p class="text-slate-300 text-sm sm:text-base">
                    Comprehensive, mathematically grounded curricula engineered to take you from foundational intuition to production deployment.
                </p>
            </div>

            <!-- Search & Filter Bar -->
            <div class="glass-panel p-4 sm:p-6 rounded-3xl border border-white/10 mb-12 shadow-xl space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                    
                    <!-- Search Input -->
                    <div class="md:col-span-6 relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <input type="text" id="catalogSearchInput" placeholder="Search by title, topic, or keyword (e.g. Neural, LLMs, Regression)..." class="w-full pl-10 pr-4 py-3 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-slate-500 text-xs focus:outline-none focus:border-cyan-400">
                    </div>

                    <!-- Category Pills -->
                    <div class="md:col-span-6 flex flex-wrap items-center justify-start md:justify-end gap-1.5">
                        <button data-category="all" class="catalog-filter-btn active px-3 py-1.5 rounded-xl text-xs font-medium bg-cyan-400/20 text-cyan-400 border border-cyan-400/40">All Courses</button>
                        <button data-category="fundamentals" class="catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-white/5 text-slate-300 border border-white/10 hover:text-white">Foundations</button>
                        <button data-category="ml" class="catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-white/5 text-slate-300 border border-white/10 hover:text-white">Machine Learning</button>
                        <button data-category="dl" class="catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-white/5 text-slate-300 border border-white/10 hover:text-white">Deep Learning</button>
                        <button data-category="genai" class="catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-white/5 text-slate-300 border border-white/10 hover:text-white">Generative AI</button>
                        <button data-category="cv" class="catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-white/5 text-slate-300 border border-white/10 hover:text-white">Vision</button>
                    </div>

                </div>
            </div>

            <!-- Course Catalog Grid (Injected by CourseController.js) -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="courseCatalogGrid">
                <!-- Dynamically Rendered via MVC Pattern -->
            </div>

        </div>
    </main>

    <!-- GLOBAL FOOTER -->
    <footer class="bg-[#060813] border-t border-white/10 relative z-10 pt-16 pb-12" id="globalFooter"></footer>

    <!-- MVC ARCHITECTURE SCRIPTS -->
    <script src="assets/js/views/UIComponents.js"></script>
    <script src="assets/js/views/ParticleCanvas.js"></script>
    <script src="assets/js/models/CourseModel.js"></script>
    <script src="assets/js/services/StorageService.js"></script>
    <script src="assets/js/controllers/NavigationController.js"></script>
    <script src="assets/js/controllers/CourseController.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>

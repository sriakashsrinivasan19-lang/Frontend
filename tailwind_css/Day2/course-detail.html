<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Player — AI Learn Enterprise</title>
    <meta name="description" content="Interactive learning player and module curriculum viewer.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Enterprise Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>

<body data-page="course-detail" class="bg-[#060813] text-slate-200 font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-300 overflow-x-hidden min-h-screen relative">

    <canvas id="neuralCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-30"></canvas>

    <div class="glow-sphere w-96 h-96 bg-cyan-500/10 top-0 right-1/4"></div>
    <div class="glow-sphere w-96 h-96 bg-purple-600/10 bottom-1/3 left-10"></div>

    <!-- GLOBAL NAVBAR -->
    <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 glass-nav" id="globalNavbar"></header>

    <main class="relative z-10 pt-28 pb-20" id="courseDetailView">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Breadcrumb Navigation -->
            <div class="flex items-center gap-2 text-xs font-mono text-slate-400 mb-6">
                <a href="courses.html" class="hover:text-cyan-400">Courses</a>
                <span>/</span>
                <span class="text-white font-semibold" id="detailCourseTitle">Course Details</span>
            </div>

            <!-- Course Header Card -->
            <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-white/10 mb-8 shadow-2xl">
                <h1 class="text-2xl sm:text-3xl font-display font-extrabold text-white mb-3" id="detailCourseHeader">Curriculum Overview</h1>
                <p class="text-slate-300 text-sm leading-relaxed max-w-4xl mb-6" id="detailCourseDesc">
                    Course details loading...
                </p>

                <!-- Learning Outcomes Section -->
                <div class="pt-6 border-t border-white/10">
                    <h3 class="text-xs font-mono font-bold uppercase tracking-wider text-cyan-400 mb-3">Expected Learning Competencies</h3>
                    <ul class="grid grid-cols-1 md:grid-cols-2 gap-3" id="detailOutcomesList">
                        <!-- Injected by CourseController.js -->
                    </ul>
                </div>
            </div>

            <!-- Main Interactive Player Area (Sidebar + Active Lesson) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <!-- Left Sidebar: Modules & Syllabus -->
                <div class="lg:col-span-4 glass-panel p-5 rounded-3xl border border-white/10 shadow-xl sticky top-28">
                    <h3 class="text-sm font-display font-bold text-white mb-4 flex items-center justify-between">
                        <span>Course Modules</span>
                        <span class="text-[10px] font-mono text-cyan-400 px-2 py-0.5 rounded bg-cyan-400/10">Interactive</span>
                    </h3>
                    <div id="detailCurriculumSidebar" class="space-y-4 max-h-[70vh] overflow-y-auto pr-1">
                        <!-- Injected by CourseController.js -->
                    </div>
                </div>

                <!-- Right View: Active Lesson Player / Content View -->
                <div class="lg:col-span-8" id="activeLessonView">
                    <!-- Injected by CourseController.js -->
                </div>

            </div>

        </div>
    </main>

    <!-- GLOBAL FOOTER -->
    <footer class="bg-[#060813] border-t border-white/10 relative z-10 pt-16 pb-12" id="globalFooter"></footer>

    <!-- MVC ARCHITECTURE SCRIPTS -->
    <script src="assets/js/views/UIComponents.js"></script>
    <script src="assets/js/views/ParticleCanvas.js"></script>
    <script src="assets/js/models/CourseModel.js"></script>
    <script src="assets/js/services/StorageService.js"></script>
    <script src="assets/js/controllers/NavigationController.js"></script>
    <script src="assets/js/controllers/CourseController.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>

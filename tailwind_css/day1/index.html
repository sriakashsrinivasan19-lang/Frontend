<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind & Design</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- task-1 <h1> -->
    <header>
        <div class="text-blue-500 font-bold text-center">
            <h1>This is Tailwind</h1>
        </div>
    </header>

    <main>
        <!-- task-2, 4 box -->
        <section class="flex gap-4 justify-center mt-7 text-center">
            <div class="p-5 bg-blue-500 rounded-lg w-40 h-30">
                <h2>box1</h2>
            </div>
             <div class="p-5 bg-blue-500 rounded-lg w-40 h-30">
                <h2>box2</h2>
            </div>
        </section>
        <!-- task-3, 5 button + button-hover -->
        <div class="flex justify-center mt-7">
            <button class="  bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded">Submit</button>
        </div>
    </main>

    <footer>
        <!-- footer  section-->
        <div class="flex justify-center mt-20">
            <p>@copy 2026 | thank you</p>
        </div>
    </footer>
</body>
</html>
